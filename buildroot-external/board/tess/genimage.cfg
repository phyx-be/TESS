# Tess SD NAND (480 MiB, or larger)
#
#   8 KiB  U-Boot with SPL (the T113 boot ROM loads it from 8 KiB)
#   1 MiB  U-Boot environment, two redundant copies of 64 KiB (blank in
#          the image: U-Boot starts from its default environment and saves
#          it on the first boot, see uboot/tess-main.fragment)
#   4 MiB  mmcblk0p1: root filesystem slot A, read-only
# 100 MiB  mmcblk0p2: root filesystem slot B, read-only
# 196 MiB  mmcblk0p3: data, read-write, the rest of the SD NAND. Not in
#          this image, so writing it (tess-install) leaves the data alone:
#          /etc/init.d/S00datafs adds the partition when it is missing,
#          from the first 4 MiB boundary after slot B to the end of the
#          SD NAND, and a filesystem when it has none.
#
# Both slots get the same root filesystem, so slot B is a valid fallback
# until the first RAUC update.

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K # 1MB - 8KB
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 4M
		size = 96M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 96M
	}
}
