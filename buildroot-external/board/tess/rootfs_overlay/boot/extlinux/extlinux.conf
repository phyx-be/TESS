# Loaded by U-Boot from the root filesystem slot it selected (tess_boot in
# board/sunxi/tess.env): tess_part is the partition number of that slot,
# tess_slot its RAUC name (A or B). The root filesystem is mounted
# read-only.
label TESS
    kernel /boot/zImage
    devicetree /boot/sun8i-t113s-tess.dtb
    # Raspberry Pi 7" DSI display; remove this line when it is not connected
    fdtoverlays /boot/rpi-7inch-dsi.dtbo
    append console=tty0 console=ttyS3,115200 root=/dev/mmcblk0p${tess_part} ro rootwait rauc.slot=${tess_slot} panic=10 fbcon=rotate:1 ${extra}
