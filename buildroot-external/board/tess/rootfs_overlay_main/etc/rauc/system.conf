# RAUC: A/B root filesystems on the SD NAND, U-Boot selects the slot
# (BOOT_ORDER, BOOT_A_LEFT, BOOT_B_LEFT in the U-Boot environment, see
# board/phyxbe/tess/uboot/tess.env)

[system]
compatible=phyxbe-tess
bootloader=uboot
mountprefix=/run/rauc
data-directory=/data/rauc

[keyring]
path=/etc/rauc/keyring.pem
# Tess has no RTC and may not have network time: check the certificate
# against the time the bundle was signed, not the system clock
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/mmcblk0p1
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p2
type=ext4
bootname=B
